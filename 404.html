<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | AppleBox Production Services</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080808">
  <link rel="icon" type="image/png" sizes="64x64" href="pages/brandimage/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #080808;
      color: #f4f1ec;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .code {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(96px, 20vw, 180px);
      line-height: 1;
      letter-spacing: 0.04em;
      color: #6abf2e;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(24px, 5vw, 40px);
      letter-spacing: 0.06em;
      font-weight: 400;
      margin-top: 8px;
    }
    p { margin-top: 14px; font-size: 15px; opacity: 0.7; line-height: 1.6; }
    a.btn {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 36px;
      background: #6abf2e;
      color: #080808;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      transition: opacity 0.3s ease;
    }
    a.btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>This page is off set</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a class="btn" href="/">Back to Home</a>
  </main>
</body>
</html>
